services:
  # ── Reverse Proxy ─────────────────────────────────────────────
  traefik:
    image: traefik:v3
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
    environment:
      - DOCKER_API_VERSION=1.40
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme-data:/acme

  # ── Application ───────────────────────────────────────────────
  web:
    image: ${RALLLY_IMAGE:-lukevella/rallly:4}
    restart: always
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_BASE_URL=https://${DOMAIN}
      # Database — defaults to the bundled Postgres service.
      # Override DATABASE_URL in .env to point at an external provider
      # (RDS, Supabase, Neon, ...). Setting it disables the bundled db.
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@db:5432/rallly}
      # Object storage — defaults to the bundled Garage service.
      # Override S3_ENDPOINT / S3_BUCKET_NAME / S3_REGION in .env to point
      # at an external provider (AWS S3, Cloudflare R2, MinIO, ...).
      - S3_ENDPOINT=${S3_ENDPOINT:-http://garage:3900}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-rallly}
      - S3_REGION=${S3_REGION:-garage}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  # ── Database (bundled) ────────────────────────────────────────
  # Only started when the `bundled-db` profile is active.
  # rallly.sh enables this profile automatically unless DATABASE_URL
  # is set in .env to an external Postgres endpoint.
  db:
    image: postgres:14-alpine
    restart: always
    profiles: ["bundled-db"]
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=rallly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Object Storage (bundled) ─────────────────────────────────
  # Only started when the `bundled-storage` profile is active.
  # rallly.sh enables this profile automatically unless S3_ENDPOINT
  # is set in .env to a non-Garage endpoint.
  garage:
    image: dxflrs/garage:v2.3.0
    restart: always
    profiles: ["bundled-storage"]
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY_ID}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_ACCESS_KEY}
      - GARAGE_DEFAULT_BUCKET=rallly
    command: /garage server --single-node --default-bucket
    healthcheck:
      test: ["CMD", "/garage", "stats", "-a"]
      interval: 1h
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 5s

volumes:
  db-data:
  garage-meta:
  garage-data:
  acme-data:
