{{- if .Values.garage.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rallly.garage.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rallly.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  GARAGE_RPC_SECRET: {{ include "rallly.generateHexSecret" (dict "context" . "value" .Values.garage.rpcSecret "secretName" (include "rallly.garage.secretName" .) "key" "GARAGE_RPC_SECRET" "length" 64) | quote }}
  GARAGE_DEFAULT_ACCESS_KEY: {{ include "rallly.generateSecret" (dict "context" . "value" .Values.garage.accessKeyId "secretName" (include "rallly.garage.secretName" .) "key" "GARAGE_DEFAULT_ACCESS_KEY" "length" 24) | quote }}
  GARAGE_DEFAULT_SECRET_KEY: {{ include "rallly.generateSecret" (dict "context" . "value" .Values.garage.secretAccessKey "secretName" (include "rallly.garage.secretName" .) "key" "GARAGE_DEFAULT_SECRET_KEY" "length" 48) | quote }}
{{- end }}
